<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Book of Five Tales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #191919;
            color: #d1c7bd;
            font-family: 'EB Garamond', serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cinzel { font-family: 'Cinzel', serif; }
        .medieval { font-family: 'MedievalSharp', cursive; }

        /* Estilo de libro abierto en 2 páginas */
        .book-container {
            width: 100%;
            max-width: 850px;
            background: #191919;
            perspective: 1500px;
        }

        .book-spread {
            display: flex;
            background-color: #f2e3c6;
            background-image: radial-gradient(#e5d1ab 1px, transparent 0);
            background-size: 16px 16px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
            border: 8px solid #2b1810;
            position: relative;
            overflow: hidden;
            min-height: 520px;
        }

        /* Lomo central del libro */
        .book-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 30px;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.2) 0%, 
                rgba(0,0,0,0.5) 40%, 
                rgba(0,0,0,0.6) 50%, 
                rgba(0,0,0,0.5) 60%, 
                rgba(0,0,0,0.2) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .page {
            flex: 1;
            padding: 28px 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), rgba(0,0,0,0.05));
        }

        .page-left {
            border-right: 1px solid rgba(0,0,0,0.15);
            box-shadow: inset -10px 0 15px -5px rgba(0,0,0,0.15);
        }

        .page-right {
            border-left: 1px solid rgba(0,0,0,0.15);
            box-shadow: inset 10px 0 15px -5px rgba(0,0,0,0.15);
        }

        .page-number {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: #8c7355;
            text-align: center;
            border-top: 1px solid rgba(140, 115, 85, 0.3);
            padding-top: 6px;
            margin-top: 10px;
        }

        /* Drop cap / Letra capital */
        .drop-cap {
            float: left;
            font-family: 'MedievalSharp', cursive;
            font-size: 3.2rem;
            line-height: 0.8;
            padding-top: 4px;
            padding-right: 8px;
            color: #5c1d1d;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }

        .text-body {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2b231d;
            text-align: justify;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a39585;
            transition: all 0.2s;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #f2e3c6;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- Control Bar Top -->
        <div class="flex justify-between items-center mb-3 px-2">
            <div class="text-xs cinzel text-amber-600/80 tracking-widest flex items-center gap-1.5">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span>OCTOBER 31st • HALLOWEEN</span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleAudio()" id="audioBtn" class="btn-ghost p-1.5 rounded-md text-xs flex items-center gap-1" title="Ambiente de Tormenta">
                    <i data-lucide="volume-x" id="audioIcon" class="w-4 h-4"></i>
                </button>
                <button onclick="playThunder()" class="btn-ghost p-1.5 rounded-md text-xs flex items-center gap-1" title="Trueno">
                    <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
                </button>
                <button onclick="copyText()" class="btn-ghost p-1.5 rounded-md text-xs flex items-center gap-1" title="Copiar Relato">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Book Spread Area -->
        <div class="book-spread">
            <div class="book-spine"></div>

            <!-- Left Page -->
            <div class="page page-left">
                <div>
                    <h1 class="medieval text-center text-lg md:text-xl text-red-950 mb-3 border-b border-amber-900/20 pb-2">
                        𓆩 𝑻𝒉𝒆 𝒃𝒐𝒐𝒌 𝒐𝒇 𝒇𝒊𝒗𝒆 𝒕𝒂𝒍𝒆𝒔 𓆪
                    </h1>
                    <div class="text-body" id="leftPageContent">
                        <!-- Content dynamically injected -->
                    </div>
                </div>
                <div class="page-number" id="leftPageNum">PÁGINA 1</div>
            </div>

            <!-- Right Page -->
            <div class="page page-right">
                <div>
                    <div class="text-body mt-2" id="rightPageContent">
                        <!-- Content dynamically injected -->
                    </div>
                </div>
                <div class="page-number" id="rightPageNum">PÁGINA 2</div>
            </div>
        </div>

        <!-- Navigation Controls Bottom -->
        <div class="flex justify-between items-center mt-3 px-2">
            <button onclick="prevSpread()" id="prevBtn" class="btn-ghost px-3 py-1.5 rounded-md text-xs cinzel flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i> Anterior
            </button>
            <span class="text-xs cinzel text-stone-500" id="spreadIndicator">1 / 4</span>
            <button onclick="nextSpread()" id="nextBtn" class="btn-ghost px-3 py-1.5 rounded-md text-xs cinzel flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                Siguiente <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const fullStory = `La tormenta comenzó poco después de que Lucy regresara de la escuela. El cielo, que hasta hacía unos minutos conservaba los últimos vestigios de luz, se había teñido de un gris oscuro y amenazante. El viento agitaba los árboles, la lluvia golpeaba los tejados y los truenos resonaban a lo lejos, anunciando que aquella noche sería mucho más larga de lo esperado.

Sin ganas de quedarse esperando bajo la lluvia, Lucy subió al primer autobús que encontró, sin detenerse siquiera a comprobar su destino. Lo único que quería era llegar a casa antes de que la tormenta empeorara.

Sin embargo, el viaje no duró demasiado. A mitad del recorrido, un fuerte ruido interrumpió el traqueteo del motor. El autobús se detuvo bruscamente y el conductor anunció que una de las ruedas se había pinchado. Tendrían que esperar hasta que alguien pudiera ayudarlos.

Lucy miró por la ventana. Afuera, la lluvia caía con tanta fuerza que apenas conseguía distinguir lo que había al otro lado del cristal. Cuando finalmente descendió, descubrió que se encontraba frente a un cementerio. No recordaba haber pasado por aquella zona antes.

Mientras intentaba orientarse, vio a una mujer cruzar la entrada del lugar. Llevaba una figura elegante y caminaba bajo la lluvia con una tranquilidad que contrastaba extrañamente con la violencia de la tormenta. Lucy supuso que trabajaría allí o que habría acudido a visitar la tumba de algún familiar. No le pareció especialmente extraño. Después de todo, incluso en Halloween, los cementerios seguían siendo lugares que alguien podía necesitar visitar.

Así que decidió seguirla. Pero, cuando llegó a la entrada, la mujer había desaparecido. Lucy miró a ambos lados, esperando encontrarla entre los árboles o a lo lejos, advancing por alguno de los senderos. No vio a nadie. —Qué raro… —murmuró.

Convencida de que debía de encontrarse dentro del cementerio, se acercó a las rejas. Fue entonces cuando sucedió algo que no supo explicar. Las puertas comenzaron a abrirse lentamente ante ella. No había nadie al otro lado. Ninguna mano empujaba el hierro, ningún mecanismo parecía ponerse en movimiento. Simplemente se abrieron, acompañadas por un largo chirrido que se perdió entre los truenos.

Lucy vaciló durante unos segundos. Después, entró. El cementerio parecía distinto de cualquier otro que hubiera visto. Las lápidas se extendían entre árboles oscuros, las figuras de piedra emergían de la niebla y los senderos desaparecían bajo una fina capa de hojas húmedas. Todo estaba sumido en una quietud inquietante, como si la tormenta no pudiera penetrar del todo en aquel lugar.

Un relámpago iluminó repentinamente el cielo. El estruendo que siguió fue tan ensordecedor que Lucy se sobresaltó y corrió hacia el edificio más cercano: una pequeña capilla de aspecto antiguo, escondida entre los árboles. Empujó la puerta y entró, agradecida por haber encontrado un refugio.

Pero apenas estuvo dentro, un ruido metálico resonó a sus espaldas. Las puertas se habían cerrado. Lucy se volvió de inmediato e intentó abrirlas, pero no consiguió moverlas. Probó una segunda vez, con más fuerza. Nada.

Fue entonces cuando reparó en el interior de la capilla. Había bancos cubiertos de polvo, candelabros ennegrecidos por el tiempo y un altar de piedra sobre el que descansaba un libro. Era imposible no verlo. Tenía una cubierta oscura, desgastada en los bordes, y un pequeño emblema plateado grabado en el centro. No había título en el lomo ni nombre alguno que indicara quién lo había escrito. A su alrededor, el polvo parecía intacto, como si nadie lo hubiera tocado en décadas.

Lucy se acercó. Sobre la primera página encontró una inscripción: «Cinco relatos aguardan a quien se atreva a leerlos. Cada historia tiene un principio. Cada historia tiene un final. Pero no todos los que comienzan a leer consiguen regresar a la realidad de la que proceden».

Frunció el ceño. Aquello tenía que ser alguna clase de libro antiguo, quizá una colección de historias preparada para Halloween. Una coincidencia extraña, sin duda, pero nada más. Abrió la primera página. Había cinco relatos. Cinco historias de terror, cada una acompañada por un título y una ilustración inquietantemente detallada.

Lucy todavía no lo sabía, pero aquel libro no había llegado a sus manos por casualidad. Tampoco sabía que, al comenzar a leer, dejaría de ser una simple espectadora. Porque aquellas historias no estaban escritas para ser imaginadas. Estaban escritas para ser vividas. Y Lucy estaba a punto de descubrirlo.`;

        // Dividir texto en 8 páginas (4 pliegos / spreads)
        const paragraphs = fullStory.split('\n\n');
        const spreads = [
            {
                left: `<span class="drop-cap">L</span>a tormenta comenzó poco después de que Lucy regresara de la escuela. El cielo, que hasta hacía unos minutos conservaba los últimos vestigios de luz, se había teñido de un gris oscuro y amenazante.<br><br>El viento agitaba los árboles, la lluvia golpeaba los tejados y los truenos resonaban a lo lejos, anunciando que aquella noche sería mucho más larga de lo esperado.`,
                right: `Sin ganas de quedarse esperando bajo la lluvia, Lucy subió al primer autobús que encontró, sin detenerse siquiera a comprobar su destino.<br><br>Lo único que quería era llegar a casa antes de que la tormenta empeorara.<br><br>Sin embargo, el viaje no duró demasiado. A mitad del recorrido, un fuerte ruido interrumpió el traqueteo del motor. El autobús se detuvo bruscamente.`
            },
            {
                left: `El conductor anunció que una de las ruedas se había pinchado. Tendrían que esperar hasta que alguien pudiera ayudarlos.<br><br>Lucy miró por la ventana. Afuera, la lluvia caía con tanta fuerza que apenas conseguía distinguir lo que había al otro lado del cristal.<br><br>Cuando finalmente descendió, descubrió que se encontraba frente a un cementerio. No recordaba haber pasado por aquella zona antes.`,
                right: `Mientras intentaba orientarse, vio a una mujer cruzar la entrada del lugar. Llevaba una figura elegante y caminaba bajo la lluvia con una tranquilidad que contrastaba extrañamente con la violencia de la tormenta.<br><br>Lucy supuso que trabajaría allí o que habría acudido a visitar la tumba de algún familiar. No le pareció especialmente extraño.`
            },
            {
                left: `Así que decidió seguirla.<br><br>Pero, cuando llegó a la entrada, la mujer había desaparecido. Lucy miró a ambos lados, esperando encontrarla entre los árboles o a lo lejos, avanzando por alguno de los senderos. No vio a nadie.<br><br>—Qué raro… —murmuró.<br><br>Convencida de que debía de encontrarse dentro del cementerio, se acercó a las rejas. Fue entonces cuando sucedió algo que no supo explicar.`,
                right: `Las puertas comenzaron a abrirse lentamente ante ella. No había nadie al otro lado. Ninguna mano empujaba el hierro, ningún mecanismo parecía ponerse en movimiento.<br><br>Simplemente se abrieron, acompañadas por un largo chirrido que se perdió entre los truenos.<br><br>Lucy vaciló durante unos segundos. Después, entró.`
            },
            {
                left: `El cementerio parecía distinto de cualquier otro. Las lápidas se extendían entre árboles oscuros y la niebla se elevaba sobre las tumbas.<br><br>Un relámpago iluminó el cielo y Lucy corrió hacia una pequeña capilla. Al entrar, las puertas se cerraron de golpe a sus espaldas.<br><br>En el altar descansaba un libro antiguo con un emblema plateado.`,
                right: `Sobre la primera página leyó:<br><br><i class="block border-l-2 border-red-900/40 pl-2 my-2 text-stone-800">«Cinco relatos aguardan a quien se atreva a leerlos... Pero no todos los que comienzan a leer consiguen regresar.»</i><br>Aquellas historias no estaban escritas para ser imaginadas.<br><b class="text-red-950 medieval block mt-2">Estaban escritas para ser vividas.</b>`
            }
        ];

        let currentSpread = 0;

        function renderSpread() {
            const spread = spreads[currentSpread];
            document.getElementById('leftPageContent').innerHTML = spread.left;
            document.getElementById('rightPageContent').innerHTML = spread.right;

            document.getElementById('leftPageNum').innerText = `PÁGINA ${currentSpread * 2 + 1}`;
            document.getElementById('rightPageNum').innerText = `PÁGINA ${currentSpread * 2 + 2}`;

            document.getElementById('spreadIndicator').innerText = `${currentSpread + 1} / ${spreads.length}`;

            document.getElementById('prevBtn').disabled = currentSpread === 0;
            document.getElementById('nextBtn').disabled = currentSpread === spreads.length - 1;
        }

        function nextSpread() {
            if (currentSpread < spreads.length - 1) {
                currentSpread++;
                renderSpread();
                playPageFlip();
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                renderSpread();
                playPageFlip();
            }
        }

        // Web Audio API para efectos de sonido
        let audioCtx = null;
        let rainGain = null;
        let isPlayingAudio = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            const btn = document.getElementById('audioBtn');
            const icon = document.getElementById('audioIcon');

            if (!isPlayingAudio) {
                // Crear sonido de lluvia
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;

                rainGain = audioCtx.createGain();
                rainGain.gain.value = 0.08;

                whiteNoise.connect(filter);
                filter.connect(rainGain);
                rainGain.connect(audioCtx.destination);

                whiteNoise.start();
                isPlayingAudio = true;
                icon.setAttribute('data-lucide', 'volume-2');
                btn.classList.add('text-amber-500');
            } else {
                if (rainGain) rainGain.gain.value = 0;
                isPlayingAudio = false;
                icon.setAttribute('data-lucide', 'volume-x');
                btn.classList.remove('text-amber-500');
            }
            lucide.createIcons();
        }

        function playThunder() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.2);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }

        function playPageFlip() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function copyText() {
            navigator.clipboard.writeText(fullStory).then(() => {
                alert('¡Relato copiado al portapapeles!');
            });
        }

        // Inicializar libro
        renderSpread();
    </script>
</body>
</html>
