<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Book of Five Tales - Notion Book Widget</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spooky: {
                            gold: '#c5a059',
                            darkGold: '#7a5f28',
                            blood: '#7a0909',
                            parchmentLeft: '#f2e3c6',
                            parchmentRight: '#eee0bf',
                            ink: '#231b15',
                        }
                    },
                    fontFamily: {
                        gothic: ['UnifrakturMaguntia', 'serif'],
                        cinzel: ['Cinzel', 'serif'],
                        cinzelDeco: ['Cinzel Decorative', 'serif'],
                        book: ['IM Fell English', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Transparent Background for Seamless Notion Embed */
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Open Book Spread Container Shadow */
        .book-spread {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75), 0 5px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            position: relative;
        }

        /* Central Spine Shadow Effect (3D Folding Line) */
        .book-spine-shadow {
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.35) 0%,
                rgba(0, 0, 0, 0.15) 35%,
                rgba(0, 0, 0, 0.45) 50%,
                rgba(0, 0, 0, 0.15) 65%,
                rgba(0, 0, 0, 0.35) 100%
            );
        }

        /* Parchment Texture with Burned Edge Gradients */
        .parchment-page-left {
            background: radial-gradient(circle at 10% 20%, #f7e8cc 0%, #e8d5b2 100%);
            box-shadow: inset 12px 0 25px -10px rgba(0,0,0,0.4), inset 0 0 20px rgba(74, 45, 20, 0.25);
        }

        .parchment-page-right {
            background: radial-gradient(circle at 90% 20%, #f7e8cc 0%, #e8d5b2 100%);
            box-shadow: inset -12px 0 25px -10px rgba(0,0,0,0.4), inset 0 0 20px rgba(74, 45, 20, 0.25);
        }

        /* Drop Cap Styling */
        .drop-cap::first-letter {
            font-family: 'UnifrakturMaguntia', serif;
            float: left;
            font-size: 2.8rem;
            line-height: 0.8;
            padding-top: 2px;
            padding-right: 6px;
            color: #7a0909;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Custom Scrollbar for compact reading */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(43, 27, 23, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: #8b5a2b;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7a0909;
        }

        /* Page Turn Animation Effect */
        .page-fade {
            animation: pageFade 0.4s ease-in-out;
        }

        @keyframes pageFade {
            0% { opacity: 0.3; transform: scale(0.995); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="p-2 sm:p-4 flex flex-col items-center justify-center min-h-screen text-spooky-ink">

    <!-- Notion Floating Audio & Utility Bar -->
    <div class="w-full max-w-4xl mb-2 flex items-center justify-between px-3 py-1.5 bg-black/80 backdrop-blur-md rounded-full border border-amber-900/40 text-amber-200/90 shadow-lg text-xs">
        <div class="flex items-center gap-2 font-cinzel font-semibold tracking-wider text-amber-400">
            <i data-lucide="book-open" class="w-4 h-4 text-amber-500 animate-pulse"></i>
            <span class="hidden sm:inline">The Book of Five Tales</span>
        </div>

        <!-- Audio Synthesizer & Action Controls -->
        <div class="flex items-center gap-3">
            <button id="btnAudioToggle" title="Sonido Ambiental (Lluvia/Viento)" class="flex items-center gap-1.5 hover:text-amber-400 transition bg-amber-950/40 px-2.5 py-1 rounded-full border border-amber-800/40">
                <i id="audioIcon" data-lucide="volume-x" class="w-3.5 h-3.5 text-red-400"></i>
                <span id="audioStatusText" class="font-cinzel text-[11px]">Audio</span>
            </button>

            <button id="btnThunder" title="Efecto Trueno VHS" class="hover:text-amber-400 transition p-1 bg-amber-950/40 rounded-full border border-amber-800/40">
                <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-300"></i>
            </button>

            <button id="btnCopyText" title="Copiar historia completa" class="flex items-center gap-1 hover:text-amber-400 transition bg-amber-950/40 px-2.5 py-1 rounded-full border border-amber-800/40">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline font-cinzel text-[11px]">Copiar</span>
            </button>
        </div>
    </div>

    <!-- MAIN OPEN BOOK SPREAD (DOBLE PÁGINA ESTILO LIBRO) -->
    <div id="bookSpread" class="book-spread w-full max-w-4xl bg-amber-950/90 p-1.5 sm:p-2.5 border border-amber-900/60 rounded-lg relative overflow-hidden">
        
        <!-- Outer Leather Edge Layer -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-1 md:gap-0 relative rounded border border-amber-900/40 overflow-hidden bg-[#1f130b]">
            
            <!-- CENTRAL SPINE (Lomo 3D en el centro) -->
            <div class="hidden md:block absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-8 z-30 pointer-events-none book-spine-shadow"></div>

            <!-- LEFT PAGE -->
            <div id="leftPageContainer" class="parchment-page-left p-4 sm:p-6 md:p-8 min-h-[420px] sm:min-h-[460px] max-h-[520px] flex flex-col justify-between border-b md:border-b-0 md:border-r border-amber-950/20 relative">
                
                <!-- Page Header Left -->
                <div class="flex justify-between items-center border-b border-amber-900/20 pb-2 mb-3">
                    <span class="font-cinzel text-[10px] sm:text-xs text-amber-950 font-bold tracking-widest uppercase opacity-75">
                        𓆩 October 31st 𓆪
                    </span>
                    <span id="leftPageNum" class="font-cinzel text-[10px] text-amber-900 font-semibold">Pág. I</span>
                </div>

                <!-- Page Content Left -->
                <div id="leftPageContent" class="page-fade flex-grow font-book text-sm sm:text-base leading-relaxed text-spooky-ink overflow-y-auto pr-1">
                    <!-- Dynamic Left Content -->
                </div>

            </div>

            <!-- RIGHT PAGE -->
            <div id="rightPageContainer" class="parchment-page-right p-4 sm:p-6 md:p-8 min-h-[420px] sm:min-h-[460px] max-h-[520px] flex flex-col justify-between relative">
                
                <!-- Page Header Right -->
                <div class="flex justify-between items-center border-b border-amber-900/20 pb-2 mb-3">
                    <span class="font-cinzel text-[10px] sm:text-xs text-amber-950 font-bold tracking-widest uppercase opacity-75">
                        Halloween Night
                    </span>
                    <span id="rightPageNum" class="font-cinzel text-[10px] text-amber-900 font-semibold">Pág. II</span>
                </div>

                <!-- Page Content Right -->
                <div id="rightPageContent" class="page-fade flex-grow font-book text-sm sm:text-base leading-relaxed text-spooky-ink overflow-y-auto pr-1">
                    <!-- Dynamic Right Content -->
                </div>

            </div>

        </div>

        <!-- FOOTER BOOK NAVIGATION CONTROLS -->
        <div class="flex justify-between items-center mt-2 px-2 pt-1 border-t border-amber-900/40 text-xs font-cinzel text-amber-200">
            <button id="btnPrevSpread" class="px-3 py-1 bg-black/60 hover:bg-amber-900/60 border border-amber-800/50 rounded-full transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Anterior</span>
            </button>

            <!-- Spread Indicator -->
            <div id="spreadIndicator" class="text-[11px] text-amber-400/90 font-semibold tracking-wider">
                Sección 1 de 3
            </div>

            <button id="btnNextSpread" class="px-3 py-1 bg-black/60 hover:bg-amber-900/60 border border-amber-800/50 rounded-full transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed">
                <span class="hidden sm:inline">Siguiente</span>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>

    </div>

    <!-- Modal Popup for Notifications -->
    <div id="modalNotice" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-amber-800 p-5 rounded-xl max-w-xs w-full text-center shadow-2xl">
            <i data-lucide="check-circle" class="w-10 h-10 text-amber-500 mx-auto mb-2"></i>
            <h3 id="modalTitle" class="font-cinzel text-base text-amber-400 font-bold mb-1">¡Copiado!</h3>
            <p id="modalMessage" class="text-slate-300 text-xs mb-4 font-book">La historia ha sido copiada para tu Notion.</p>
            <button onclick="closeModal()" class="px-5 py-1.5 bg-amber-900 hover:bg-spooky-blood text-amber-100 rounded-full font-cinzel text-xs transition">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        // Data structure split for Dual-Page Spread Layout
        const storySpreads = [
            {
                leftNum: "Pág. I",
                leftHTML: `
                    <div class="text-center mb-4">
                        <h2 class="font-cinzelDeco text-lg sm:text-xl text-spooky-blood font-bold tracking-wider">𓆩 𝑻𝒉𝒆 𝒃𝒐𝒐𝒌 𝒐𝒇 𝒇𝒊𝒗𝒆 𝒕𝒂𝒍𝒆𝒔 𓆪</h2>
                        <p class="font-gothic text-sm text-amber-950 mt-1">October 31st. Halloween night.</p>
                        <div class="h-[1px] w-20 bg-amber-900/30 mx-auto mt-2"></div>
                    </div>
                    <p class="drop-cap">
                        La tormenta comenzó poco después de que Lucy regresara de la escuela.
                    </p>
                    <p class="mt-2">
                        El cielo, que hasta hacía unos minutos conservaba los últimos vestigios de luz, se había teñido de un gris oscuro y amenazante. El viento agitaba los árboles, la lluvia golpeaba los tejados y los truenos resonaban a lo lejos, anunciando que aquella noche sería mucho más larga de lo esperado.
                    </p>
                    <p class="mt-2">
                        Sin ganas de quedarse esperando bajo la lluvia, Lucy subió al primer autobús que encontró, sin detenerse siquiera a comprobar su destino. Lo único que quería era llegar a casa antes de que la tormenta empeorara.
                    </p>
                `,
                rightNum: "Pág. II",
                rightHTML: `
                    <p class="italic border-l-2 border-amber-900/40 pl-3 py-0.5 text-amber-950 font-semibold mb-2">
                        Sin embargo, el viaje no duró demasiado.
                    </p>
                    <p>
                        A mitad del recorrido, un fuerte ruido interrumpió el traqueteo del motor. El autobús se detuvo bruscamente y el conductor anunció que una de las ruedas se había pinchado. Tendrían que esperar hasta que alguien pudiera ayudarlos.
                    </p>
                    <p class="mt-2">
                        Lucy miró por la ventana. Afuera, la lluvia caía con tanta fuerza que apenas conseguía distinguir lo que había al otro lado del cristal.
                    </p>
                    <p class="mt-2">
                        Cuando finalmente descendió, descubrió que se encontraba frente a un cementerio. No recordaba haber pasado por aquella zona antes.
                    </p>
                `
            },
            {
                leftNum: "Pág. III",
                leftHTML: `
                    <p>
                        Mientras intentaba orientarse, vio a una mujer cruzar la entrada del lugar. Llevaba una figura elegante y caminaba bajo la lluvia con una tranquilidad que contrastaba extrañamente con la violencia de la tormenta.
                    </p>
                    <p class="mt-2">
                        Lucy supuso que trabajaría allí o que habría acudido a visitar la tumba de algún familiar. No le pareció especialmente extraño. Después de todo, incluso en Halloween, los cementerios seguían siendo lugares que alguien podía necesitar visitar.
                    </p>
                    <p class="mt-2 font-semibold text-amber-950">
                        Así que decidió seguirla.
                    </p>
                    <p class="mt-2">
                        Pero, cuando llegó a la entrada, la mujer había desaparecido. Lucy miró a ambos lados, esperando encontrarla entre los árboles o a lo lejos, avanzando por alguno de los senderos. No vio a nadie.
                    </p>
                    <p class="font-cinzel text-base text-amber-900 mt-2 pl-2">
                        —Qué raro… —murmuró.
                    </p>
                `,
                rightNum: "Pág. IV",
                rightHTML: `
                    <p>
                        Convencida de que debía de encontrarse dentro del cementerio, se acercó a las rejas. Fue entonces cuando sucedió algo que no supo explicar.
                    </p>
                    <p class="mt-2">
                        Las puertas comenzaron a abrirse lentamente ante ella. No había nadie al otro lado. Ninguna mano empujaba el hierro, ningún mecanismo parecía ponerse en movimiento. Simplemente se abrieron, acompañadas por un largo chirrido que se perdió entre los truenos.
                    </p>
                    <p class="mt-2">
                        Lucy vaciló durante unos segundos. Después, entró.
                    </p>
                    <p class="mt-2">
                        El cementerio parecía distinto de cualquier otro. Las lápidas se extendían entre árboles oscuros, las figuras de piedra emergían de la niebla y los senderos desaparecían bajo hojas húmedas. Todo estaba sumido en una quietud inquietante.
                    </p>
                `
            },
            {
                leftNum: "Pág. V",
                leftHTML: `
                    <p>
                        Un relámpago iluminó repentinamente el cielo.
                    </p>
                    <p class="mt-2">
                        El estruendo que siguió fue tan ensordecedor que Lucy se sobresaltó y corrió hacia el edificio más cercano: una pequeña capilla de aspecto antiguo, escondida entre los árboles.
                    </p>
                    <p class="mt-2">
                        Empujó la puerta y entró, agradecida por haber encontrado un refugio. Pero apenas estuvo dentro, un ruido metálico resonó a sus espaldas. Las puertas se habían cerrado.
                    </p>
                    <p class="mt-2">
                        Lucy se volvió de inmediato e intentó abrirlas, pero no consiguió moverlas. Probó una segunda vez, con más fuerza. Nada.
                    </p>
                `,
                rightNum: "Pág. VI",
                rightHTML: `
                    <p>
                        Fue entonces cuando reparó en el interior de la capilla. Había bancos cubiertos de polvo, candelabros ennegrecidos y un altar de piedra sobre el que descansaba un libro. Tenía una cubierta oscura, desgastada, con un emblema plateado.
                    </p>

                    <!-- Inscription Box -->
                    <div class="my-3 p-3 bg-amber-950/10 border-l-2 border-spooky-blood rounded">
                        <blockquote class="font-cinzel text-xs text-amber-950 italic leading-snug">
                            «Cinco relatos aguardan a quien se atreva a leerlos. Cada historia tiene un principio. Cada historia tiene un final. Pero no todos los que comienzan a leer consiguen regresar a la realidad de la que proceden».
                        </blockquote>
                    </div>

                    <p class="font-semibold text-amber-950 text-xs sm:text-sm">
                        Porque aquellas historias no estaban escritas para ser imaginadas... Estaban escritas para ser vividas. Y Lucy estaba a punto de descubrirlo.
                    </p>
                `
            }
        ];

        let currentSpread = 0;
        let audioActive = false;
        let audioCtx = null;
        let rainNode = null;

        const fullTextForCopy = `𓆩 𝑻𝒉𝒆 𝒃𝒐𝒐𝒌 𝒐𝒇 𝒇𝒊𝒗𝒆 𝒕𝒂𝒍𝒆𝒔 𓆪\nOctober 31st. Halloween night.\n\n` +
            `La tormenta comenzó poco después de que Lucy regresara de la escuela...\n` +
            `[Historia completa de Halloween para Notion]`;

        window.onload = function() {
            lucide.createIcons();
            renderSpread();

            document.getElementById('btnNextSpread').addEventListener('click', nextSpread);
            document.getElementById('btnPrevSpread').addEventListener('click', prevSpread);
            document.getElementById('btnAudioToggle').addEventListener('click', toggleAudio);
            document.getElementById('btnThunder').addEventListener('click', triggerThunder);
            document.getElementById('btnCopyText').addEventListener('click', copyText);
        };

        function renderSpread() {
            const spread = storySpreads[currentSpread];

            const leftContent = document.getElementById('leftPageContent');
            const rightContent = document.getElementById('rightPageContent');

            leftContent.classList.remove('page-fade');
            rightContent.classList.remove('page-fade');

            void leftContent.offsetWidth; // Trigger reflow for CSS animation

            leftContent.innerHTML = spread.leftHTML;
            rightContent.innerHTML = spread.rightHTML;

            document.getElementById('leftPageNum').innerText = spread.leftNum;
            document.getElementById('rightPageNum').innerText = spread.rightNum;

            leftContent.classList.add('page-fade');
            rightContent.classList.add('page-fade');

            document.getElementById('spreadIndicator').innerText = `Sección ${currentSpread + 1} de ${storySpreads.length}`;

            document.getElementById('btnPrevSpread').disabled = (currentSpread === 0);
            document.getElementById('btnNextSpread').disabled = (currentSpread === storySpreads.length - 1);
        }

        function nextSpread() {
            if (currentSpread < storySpreads.length - 1) {
                playPageFlipSound();
                currentSpread++;
                renderSpread();
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                playPageFlipSound();
                currentSpread--;
                renderSpread();
            }
        }

        // Web Audio API Ambient Synthesizer
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            audioActive = !audioActive;
            const icon = document.getElementById('audioIcon');
            const statusText = document.getElementById('audioStatusText');

            if (audioActive) {
                startRainSynthesizer();
                icon.setAttribute('data-lucide', 'volume-2');
                icon.classList.remove('text-red-400');
                icon.classList.add('text-amber-400');
                statusText.innerText = 'ON';
            } else {
                stopRain();
                icon.setAttribute('data-lucide', 'volume-x');
                icon.classList.remove('text-amber-400');
                icon.classList.add('text-red-400');
                statusText.innerText = 'OFF';
            }
            lucide.createIcons();
        }

        function startRainSynthesizer() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;

            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 3.0;
            }

            rainNode = audioCtx.createBufferSource();
            rainNode.buffer = noiseBuffer;
            rainNode.loop = true;

            const rainFilter = audioCtx.createBiquadFilter();
            rainFilter.type = 'lowpass';
            rainFilter.frequency.setValueAtTime(800, audioCtx.currentTime);

            const rainGain = audioCtx.createGain();
            rainGain.gain.setValueAtTime(0.12, audioCtx.currentTime);

            rainNode.connect(rainFilter);
            rainFilter.connect(rainGain);
            rainGain.connect(audioCtx.destination);

            rainNode.start();
        }

        function stopRain() {
            if (rainNode) {
                try { rainNode.stop(); } catch(e){}
                rainNode = null;
            }
        }

        function playPageFlipSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function triggerThunder() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 1.2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(250, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.0);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.1);

            whiteNoise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            whiteNoise.start();
        }

        function copyText() {
            const textarea = document.createElement('textarea');
            textarea.value = fullTextForCopy;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showModal();
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        function showModal() {
            const modal = document.getElementById('modalNotice');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            const modal = document.getElementById('modalNotice');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
